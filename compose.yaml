services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: vendor_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vendor-compliance-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendor_compliance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendor-compliance-postgres: