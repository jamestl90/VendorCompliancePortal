name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: Restore, build, and test
    runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:18.4
          env:
            POSTGRES_DB: vendor_compliance
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres -d vendor_compliance"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore VendorCompliancePortal.slnx

      - name: Build
        run: dotnet build VendorCompliancePortal.slnx --configuration Release --no-restore
      - name: Apply database migrations
        run: dotnet ef database update --project src/VendorCompliance.Infrastructure/VendorCompliance.Infrastructure.csproj --startup-project src/VendorCompliance.Web/VendorCompliance.Web.csproj --context VendorComplianceDbContext --configuration Release --no-build -- --environment Development

      - name: Test
        run: dotnet test VendorCompliancePortal.slnx --configuration Release --no-build --verbosity normal
